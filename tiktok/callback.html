<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/brand-mention-monitor-icon.png" />
    <link rel="apple-touch-icon" href="/brand-mention-monitor-icon.png" />
    <title>TikTok connection | Brand Mention Monitor</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/brand-logo.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="/"><img class="brand-logo" src="/brand-mention-monitor-icon.png" alt="" />Brand Mention Monitor</a><nav aria-label="Main navigation"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></nav></header>
    <main class="legal shell">
      <p class="eyebrow">TikTok connection</p>
      <h1 id="title">Connection received.</h1>
      <p id="message">Your TikTok authorization response was received.</p>
      <p class="form-note" id="details"></p>
      <div class="actions"><a class="button primary" href="/">Return to Brand Mention Monitor</a></div>
    </main>
    <script>
      const query = new URLSearchParams(window.location.search);
      const error = query.get("error");
      const code = query.get("code");
      const returnedState = query.get("state");
      const savedState = sessionStorage.getItem("tiktok_oauth_state");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const details = document.getElementById("details");
      if (error) {
        title.textContent = "TikTok connection was cancelled.";
        message.textContent = "No TikTok data was connected. You can return and try again.";
      } else if (!code) {
        title.textContent = "No authorization response found.";
        message.textContent = "Start the connection from the Brand Mention Monitor website.";
      } else if (!returnedState || returnedState !== savedState) {
        title.textContent = "Connection could not be verified.";
        message.textContent = "The security state did not match. Please start the connection again.";
      } else {
        details.textContent = "Completing the secure connection…";
        fetch("https://brand-mention-monitor-api.onrender.com/api/tiktok/exchange", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        }).then(async (response) => {
          const result = await response.json();
          if (!response.ok) throw new Error(result.details || result.error || "Connection failed");
          const user = result.user || {};
          title.textContent = "TikTok connected successfully.";
          message.textContent = user.display_name ? `Connected account: ${user.display_name}` : "Your TikTok account is connected.";
          details.textContent = "Your authorization was completed securely. Tokens remain on the application server.";
        }).catch((connectionError) => {
          title.textContent = "TikTok authorization received.";
          message.textContent = "TikTok returned an authorization code, but the server could not complete the connection yet.";
          details.textContent = connectionError.message;
        });
      }
    </script>
  </body>
</html>
